name: "Build WSL image"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-wsl-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NIXPKGS_ALLOW_UNFREE: "1" # vault, packer, google-chrome

jobs:
  build:
    runs-on: ubuntu-latest
    # Premier run à froid long (Chrome/Chromium, compilations Rust) ;
    # les runs suivants restaurent le store depuis le cache GitHub
    # et le cache binaire nix.guillaume.engineer.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          # extra-* : ajoutés sans remplacer cache.nixos.org
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://nix.guillaume.engineer
            extra-trusted-public-keys = nix.guillaume.engineer-1:KS4Ap78vxJkaD9FTZtjcKAzD6NHQOn28/IUId/5e3kA=
            connect-timeout = 5

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-wsl-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-wsl-${{ runner.os }}-
          # purger le store de plus de 2 Go au-delà de 7 jours
          gc-max-store-size-linux: 2G

      - name: Evaluate and check flake
        run: nix flake check --print-build-logs

      # La closure du tarballBuilder contient le toplevel : un seul build suffit.
      - name: Build WSL image
        run: |
          nix build .#nixosConfigurations.wsl.config.system.build.tarballBuilder --out-link result-tarball --print-build-logs
          mkdir -p out
          sudo ./result-tarball/bin/nixos-wsl-tarball-builder out/nixos.wsl

      - name: Validate WSL image
        run: |
          test -s out/nixos.wsl && gzip -t out/nixos.wsl

      # Signe la closure construite et pousse vers nix.guillaume.engineer.
      # N'échoue pas le build si le serveur est injoignable (DNS, panne).
      - name: Push to nix.guillaume.engineer
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          CACHE_KEY: ${{ secrets.CACHE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          echo "$CACHE_KEY" > /tmp/cache.key
          chmod 600 /tmp/cache.key
          nix path-info -r ./result-tarball \
            | nix copy --to "https://nix.guillaume.engineer?secret-key=/tmp/cache.key" --stdin
          rm -f /tmp/cache.key

      - name: Upload WSL image
        uses: actions/upload-artifact@v7
        with:
          name: nixos-wsl-${{ github.sha }}
          path: out/nixos.wsl
          if-no-files-found: error
